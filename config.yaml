data:
  pairs: ["de-en", "en-ru", "en-zh"]
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  download_sample_size: 200000  # set to null for the full OPUS-100 split

tokenizer:
  model_path: "tokenizer/trained/spm.model"
  vocab_size: 16000

model:
  d_model: 256
  n_heads: 4
  d_ff: 1024
  n_layers: 4
  dropout: 0.1
  max_len: 96

training:
  batch_size: 32
  num_epochs: 1
  grad_clip: 1.0
  warmup_steps: 4000
  checkpoint_dir: "checkpoints"